<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IoT Monitoring</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 2rem;
        }
        h2 { margin-top: 0; font-size: 1.25rem; color: var(--primary); }
        .log-container {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            overflow-y: auto;
            max-height: 400px;
            border: 1px solid #334155;
        }
        .log-entry { margin-bottom: 0.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.25rem; }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        .logout-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .logout-btn:hover { color: #f8fafc; }
    </style>
    <meta http-equiv="refresh" content="5"> <!-- Auto-refresh cada 5s -->
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 style="margin:0; font-size: 1.5rem;">Panel de Monitoreo</h1>
                <p style="margin:0; color: var(--text-muted);">Bienvenido, {{ username }}</p>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">Cerrar Sesión</a>
        </header>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin:0;">Estado del Sistema</h2>
                <span class="status-badge">Servidor Activo</span>
            </div>
            <div class="log-container">
                {% if logs %}
                    {% for log in logs %}
                    <div class="log-entry">{{ log }}</div>
                    {% endfor %}
                {% else %}
                    <div style="color: var(--text-muted);">No hay logs disponibles aún...</div>
                {% endif %}
            </div>
        </div>
        
        <p style="text-align: center; color: var(--text-muted); font-size: 0.75rem;">
            Los datos se actualizan automáticamente cada 5 segundos.
        </p>
    </div>
</body>
</html>
